[project]
name = "mcp-ai-accountability"
version = "0.1.0"
description = "MCP server that measures, tracks and improves AI agent reliability so entrepreneurs can build trustworthy AI products"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Prince Ruhul", email = "princeruhulofficial@gmail.com" }
]
keywords = ["mcp", "ai-agents", "reliability", "observability", "prevalid"]
dependencies = [
    "mcp[cli]>=1.0.0",
    "fastmcp>=0.1.0",
    "pydantic>=2.0",
    "sqlite-utils>=3.0",
]

[project.scripts]
mcp-ai-accountability = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
